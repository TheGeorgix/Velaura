<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Administración · Velaura</title><link rel="stylesheet" href="/admin.css"></head><body><header><a href="/">VELAURA <small>Administración</small></a><a href="/">Ver tienda ↗</a></header><main><section id="manager"><div class="title-row"><div><p class="eyebrow">Tu catálogo</p><h1>Un lugar para cada vela.</h1></div></div><div class="toolbar"><label class="search">Buscar productos<input id="search" type="search" placeholder="Nombre o descripción"></label><button class="primary" id="add">+ Nuevo producto</button></div><p id="count" class="hint"></p><div id="list"></div></section><p id="message" role="status" aria-live="polite"></p></main><dialog id="editor"><form id="product"><div class="title-row"><h2 id="edit-title">Nuevo producto</h2><button type="button" id="close" aria-label="Cerrar">×</button></div><input name="id" type="hidden"><label>Nombre<input name="name" maxlength="120" required></label><label>Descripción<textarea name="description" maxlength="2000" rows="3"></textarea></label><div class="columns"><label>Precio ($)<input name="price" type="number" min="0" max="9999999999" step="0.01" placeholder="Sin precio"></label><label>Existencias<input name="stock" type="number" min="0" max="1000000" step="1" required value="1"></label></div><label>Foto<input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><img id="preview" alt="Vista previa de la vela" hidden><p id="edit-error" role="alert"></p><button class="primary" id="save">Guardar producto</button></form></dialog><dialog id="deletion"><h2>¿Eliminar esta vela?</h2><p>Se retirará del catálogo público. Esta acción no se puede deshacer.</p><div class="actions"><button id="cancel-delete">Cancelar</button><button class="danger" id="confirm-delete">Eliminar producto</button></div><p id="delete-error" role="alert"></p></dialog><script src="/admin.js" defer></script></body></html>
